<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>요괴 퇴치록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Brush+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game-container">
  <canvas id="game-canvas"></canvas>

  <div id="hud" class="hidden">
    <div id="status-panel" class="panel">
      <div id="portrait-box"><img id="portrait" alt=""></div>
      <div id="status-main">
        <div id="status-title"><span id="form-name"></span><span id="level"></span></div>
        <div class="bar"><div id="hp-bar"></div><span id="hp-text"></span></div>
        <div class="bar small"><div id="xp-bar"></div></div>
        <div id="evo-hint"></div>
        <div id="weapon-row"></div>
      </div>
    </div>
    <div id="top-right" class="panel">
      <div id="timer">00:00</div>
      <div id="stage-info"></div>
      <div id="kills"></div>
      <div id="gold"></div>
    </div>
  </div>

  <div id="toast" class="panel"><b id="toast-title"></b><small id="toast-sub"></small></div>

  <div id="achv-screen" class="overlay hidden">
    <div id="achv-box" class="panel">
      <div class="achv-head"><h2>업적</h2><button id="achv-close" class="close" aria-label="닫기">✕</button></div>
      <h3>업적 <span id="achv-count"></span></h3>
      <div id="achv-list"></div>
      <h3>무공 비급 <span id="book-count"></span></h3>
      <p class="hint">합성법은 직접 찾아야 기록돼요.</p>
      <div id="book-list"></div>
      <h3>협객</h3>
      <div id="hero-list"></div>
    </div>
  </div>

  <div id="banner"><div id="banner-main"></div><div id="banner-sub"></div></div>

  <div id="start-screen" class="overlay">
    <h1>요괴 퇴치록</h1>
    <p class="subtitle">협객을 골라 밤마다 몰려오는 요괴를 물리치세요</p>
    <p id="title-stats" class="hint"></p>
    <p class="teaser">무공을 극한까지 단련하면, 비급에 없던 무언가가 깨어난다고 하는데…</p>
    <p class="hint">WASD·방향키 또는 화면 드래그로 이동 · 공격은 자동 · P 일시정지</p>
    <div class="btn-row">
      <button id="start-btn" class="btn">출정</button>
      <button id="shop-btn" class="btn ghost">수련장</button>
      <button id="achv-btn" class="btn ghost">업적</button>
    </div>
  </div>

  <div id="shop-screen" class="overlay hidden">
    <div id="shop-box" class="panel">
      <div class="achv-head"><h2>수련장</h2><button id="shop-close" class="close" aria-label="닫기">✕</button></div>
      <p class="subtitle">요괴를 물리치고 모은 은자로 영구히 강해져요 · <b id="shop-gold"></b></p>
      <div id="shop-list"></div>
      <p class="hint"><button id="refund-btn" class="linklike">수련 초기화 (은자 전부 돌려받기)</button></p>
    </div>
  </div>

  <div id="choice-screen" class="overlay hidden">
    <h2 id="choice-title"></h2>
    <p id="choice-subtitle" class="subtitle"></p>
    <div id="choice-cards"></div>
    <div id="choice-tools" class="tool-row"></div>
  </div>

  <div id="pause-screen" class="overlay hidden">
    <h2>잠시 숨 고르는 중</h2>
    <div id="pause-box" class="panel">
      <p id="pause-stats" class="hint"></p>
      <h3>무공 · 심법</h3>
      <div id="pause-build"></div>
      <h3>무공별 피해</h3>
      <div id="pause-dmg" class="dmg-list"></div>
    </div>
    <div class="btn-row">
      <button id="resume-btn" class="btn">계속 (Esc)</button>
      <button id="quit-btn" class="btn ghost">로비로 나가기</button>
    </div>
  </div>

  <div id="gameover-screen" class="overlay hidden">
    <h2 id="gameover-title">쓰러졌다...</h2>
    <img id="gameover-portrait" class="pixel" alt="">
    <p id="gameover-stats" class="subtitle"></p>
    <div id="gameover-dmg" class="dmg-list panel"></div>
    <div class="btn-row">
      <button id="continue-btn" class="btn hidden">계속 싸우기</button>
      <button id="restart-btn" class="btn">다시 출정</button>
      <button id="lobby-btn" class="btn ghost">로비</button>
      <button id="achv-btn-2" class="btn ghost">업적</button>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
