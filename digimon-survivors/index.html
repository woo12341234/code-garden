<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digimon Survivors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game-container">
  <canvas id="game-canvas"></canvas>

  <div id="hud" class="hidden">
    <div id="status-panel" class="panel">
      <div id="portrait-box"><img id="portrait" alt=""></div>
      <div id="status-main">
        <div id="status-title"><span id="form-name"></span><span id="level"></span></div>
        <div class="bar"><div id="hp-bar"></div><span id="hp-text"></span></div>
        <div class="bar small"><div id="xp-bar"></div></div>
        <div id="evo-hint"></div>
      </div>
    </div>
    <div id="top-right" class="panel">
      <div id="timer">00:00</div>
      <div id="kills"></div>
    </div>
  </div>

  <div id="banner"><div id="banner-main"></div><div id="banner-sub"></div></div>

  <div id="start-screen" class="overlay">
    <h1>Digimon Survivors</h1>
    <p class="subtitle">몽실이를 지키면서 무럭무럭 진화시켜 보세요!</p>
    <div id="evo-chart" class="panel"></div>
    <p class="hint">WASD / 방향키 이동 · 공격은 자동 · P 일시정지</p>
    <button id="start-btn" class="btn">모험 시작!</button>
  </div>

  <div id="choice-screen" class="overlay hidden">
    <h2 id="choice-title"></h2>
    <p id="choice-subtitle" class="subtitle"></p>
    <div id="choice-cards"></div>
  </div>

  <div id="pause-screen" class="overlay hidden">
    <h2>잠깐 쉬는 중</h2>
    <p class="subtitle">P 키를 누르면 다시 시작해요</p>
  </div>

  <div id="gameover-screen" class="overlay hidden">
    <h2>으앙, 쓰러졌어요!</h2>
    <img id="gameover-portrait" class="pixel" alt="">
    <p id="gameover-stats" class="subtitle"></p>
    <button id="restart-btn" class="btn">다시 도전!</button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
