<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>요괴 퇴치록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Brush+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game-container">
  <canvas id="game-canvas"></canvas>

  <div id="hud" class="hidden">
    <div id="status-panel" class="panel">
      <div id="portrait-box"><img id="portrait" alt=""></div>
      <div id="status-main">
        <div id="status-title"><span id="form-name"></span><span id="level"></span></div>
        <div class="bar"><div id="hp-bar"></div><span id="hp-text"></span></div>
        <div class="bar small"><div id="xp-bar"></div></div>
        <div id="evo-hint"></div>
        <div id="weapon-row"></div>
      </div>
    </div>
    <div id="top-right" class="panel">
      <div id="timer">00:00</div>
      <div id="kills"></div>
    </div>
  </div>

  <div id="banner"><div id="banner-main"></div><div id="banner-sub"></div></div>

  <div id="start-screen" class="overlay">
    <h1>요괴 퇴치록</h1>
    <p class="subtitle">협객을 골라 밤마다 몰려오는 요괴를 물리치세요</p>
    <p id="dex-count" class="hint"></p>
    <div id="evo-chart" class="panel"></div>
    <p class="hint">WASD·방향키 또는 화면 드래그로 이동 · 공격은 자동 · P 일시정지</p>
    <button id="start-btn" class="btn">출정</button>
  </div>

  <div id="choice-screen" class="overlay hidden">
    <h2 id="choice-title"></h2>
    <p id="choice-subtitle" class="subtitle"></p>
    <div id="choice-cards"></div>
  </div>

  <div id="pause-screen" class="overlay hidden">
    <h2>잠시 숨 고르는 중</h2>
    <p class="subtitle">P 키를 누르면 다시 싸워요</p>
  </div>

  <div id="gameover-screen" class="overlay hidden">
    <h2>쓰러졌다...</h2>
    <img id="gameover-portrait" class="pixel" alt="">
    <p id="gameover-stats" class="subtitle"></p>
    <button id="restart-btn" class="btn">다시 출정</button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
