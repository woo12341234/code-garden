name: 요괴 퇴치록 - Android APK, iOS IPA & web build

on:
  push:
    paths:
      - 'digimon-survivors/**'
      - '.github/workflows/yokai-android.yml'
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the web build (itch.io / Netlify / any static host)
        working-directory: digimon-survivors
        run: |
          mkdir -p ../web-dist
          cp index.html style.css game.js manifest.webmanifest sw.js ../web-dist/
          cp -r assets ../web-dist/assets
          rm -rf ../web-dist/assets/app/android ../web-dist/assets/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: yokai-survivors-web
          path: web-dist

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: digimon-survivors/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Capacitor
        run: npm install
      - name: Create the Android project
        run: npm run android:add
      - name: Build debug APK
        run: npm run android:apk
      - uses: actions/upload-artifact@v4
        with:
          name: yokai-survivors-apk
          path: digimon-survivors/mobile/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-14
    defaults:
      run:
        working-directory: digimon-survivors/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Capacitor
        run: npm install
      - name: Create the iOS project
        run: npm run ios:add
      - name: Build unsigned app
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package unsigned IPA (sign it yourself with Sideloadly / AltStore before installing)
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr yokai-survivors-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: yokai-survivors-ios-unsigned-ipa
          path: digimon-survivors/mobile/yokai-survivors-unsigned.ipa
