<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f2a1c">
<title>포커 열전</title>
<link rel="stylesheet" href="../ganghonanse/fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <span id="level"></span>
    <span class="grow"></span>
    <button class="hb" id="hintBtn" title="승률 힌트">승률</button>
    <button class="hb" id="logBtn" title="기록">기록</button>
    <button class="hb" id="speedBtn" title="속도">보통</button>
    <button class="hb" id="soundBtn" title="소리">소리</button>
    <button class="hb" id="menuBtn" title="메뉴">☰</button>
  </header>
  <main id="table">
    <div class="felt"><div class="rim"></div><div class="logo"><span>♠ ♥</span><b>포커 열전</b><span>♦ ♣</span></div></div>
    <div id="center">
      <div id="board"></div>
      <div id="pot"></div>
      <div id="msg"></div>
    </div>
    <div id="seats"></div>
    <div id="dealerBtn">D</div>
    <div id="banner"></div>
  </main>
  <section id="me">
    <div id="myCards"></div>
    <div id="myInfo"><b id="myHand"></b><span id="myOdds"></span></div>
  </section>
  <nav id="bar">
    <div id="acts">
      <button class="act fold" id="foldBtn">폴드</button>
      <button class="act call" id="callBtn">체크</button>
      <button class="act raise" id="raiseBtn">레이즈</button>
    </div>
    <div id="raisePanel">
      <div class="quick"><button data-q="min">최소</button><button data-q="half">½팟</button><button data-q="3q">¾팟</button><button data-q="pot">팟</button><button data-q="all">올인</button></div>
      <div class="slide"><input type="range" id="raiseRange"><b id="raiseAmt"></b></div>
      <div class="go"><button class="act" id="raiseCancel">취소</button><button class="act raise" id="raiseOk">레이즈</button></div>
    </div>
    <div id="nextWrap"><button class="act next" id="nextBtn">다음 판 ▶</button></div>
  </nav>
</div>

<div id="start" class="overlay on">
  <div id="decor"></div>
  <div class="panel">
    <h1>포커 열전</h1>
    <p class="sub">컴퓨터 고수들과 한 자리에서 붙는 텍사스 홀덤 토너먼트</p>
    <div class="opt"><label>상대 수</label><div class="seg" id="optN"></div></div>
    <div class="opt"><label>난이도</label><div class="seg" id="optD"></div></div>
    <div class="opt"><label>시작 칩</label><div class="seg" id="optC"></div></div>
    <p class="who" id="who"></p>
    <div class="row"><button class="big" id="newBtn">새 게임</button><button class="big ghost" id="resumeBtn">이어하기</button></div>
    <div class="row"><button class="ghost" id="statsBtn">전적</button><button class="ghost" id="rulesBtn">족보·규칙</button><button class="ghost" id="aboutBtn">안내</button></div>
  </div>
</div>
<div id="over" class="overlay"><div class="panel"><h1 id="overTitle"></h1><p id="overTxt"></p><div class="row"><button class="big" id="againBtn">한 판 더</button><button class="big ghost" id="homeBtn">처음으로</button></div></div></div>
<div id="logPanel" class="overlay"><div class="panel wide"><h2>판 기록</h2><div id="logList"></div><button class="big" data-close>닫기</button></div></div>
<div id="infoPanel" class="overlay"><div class="panel wide"><div id="infoBody"></div><button class="big" data-close>닫기</button></div></div>
<div id="menuPanel" class="overlay"><div class="panel"><h2>메뉴</h2><div class="col"><button class="big" data-close>계속하기</button><button class="big ghost" id="autoBtn">다음 판 자동: 끔</button><button class="big ghost" id="quitBtn">그만두고 처음으로</button></div></div></div>
<div id="gate" class="overlay"><div class="panel"><h2>시작하기 전에</h2><div id="gateBody"></div></div></div>

<script src="engine.js"></script>
<script src="cards.js"></script>
<script src="art.js"></script>
<script src="ui.js"></script>
</body>
</html>
