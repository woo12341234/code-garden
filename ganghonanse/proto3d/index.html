<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>강호난세 3D 시험판</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0f1418; color: #f4efe6; font-family: 'Noto Sans KR', system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .bar { position: absolute; left: 50%; transform: translateX(-50%); border-radius: 6px; overflow: hidden; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.14); }
  #xpbar { top: max(8px, env(safe-area-inset-top)); width: min(92vw, 640px); height: 8px; }
  #xpbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #6fd3ff, #b48cff); }
  #hpbar { bottom: max(14px, env(safe-area-inset-bottom)); width: min(60vw, 320px); height: 12px; }
  #hpbar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #e2433f, #ff8a5c); transition: width .15s; }
  #stats { position: absolute; top: calc(max(8px, env(safe-area-inset-top)) + 14px); left: 0; right: 0; display: flex; justify-content: center; gap: 18px; font-weight: 700; font-size: 14px; text-shadow: 0 1px 3px #000; }
  #hint { position: absolute; left: 12px; bottom: 40px; font-size: 12px; opacity: .7; text-shadow: 0 1px 2px #000; }
  .btn { pointer-events: auto; background: rgba(20,24,30,.72); border: 1px solid rgba(255,255,255,.2); color: #f4efe6; border-radius: 12px; font: inherit; font-weight: 700; padding: 10px 14px; backdrop-filter: blur(6px); }
  #jumpBtn { position: absolute; right: max(18px, env(safe-area-inset-right)); bottom: max(40px, env(safe-area-inset-bottom)); width: 78px; height: 78px; border-radius: 50%; font-size: 16px; display: none; }
  #camBtn { position: absolute; right: 12px; top: calc(max(8px, env(safe-area-inset-top)) + 40px); font-size: 12px; padding: 7px 10px; }
  #stick { position: absolute; width: 110px; height: 110px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); background: rgba(255,255,255,.06); display: none; transform: translate(-50%,-50%); }
  #stick i { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px; border-radius: 50%; background: rgba(255,255,255,.35); }
  .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px; background: rgba(8,10,14,.62); backdrop-filter: blur(4px); pointer-events: auto; padding: 16px; box-sizing: border-box; }
  .overlay.on { display: flex; }
  .overlay h1 { margin: 0; font-size: 30px; letter-spacing: 2px; }
  .overlay p { margin: 0; opacity: .8; text-align: center; font-size: 14px; line-height: 1.5; }
  .cards { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 720px; }
  .card { pointer-events: auto; width: 200px; padding: 14px; border-radius: 14px; background: linear-gradient(180deg, rgba(40,46,58,.95), rgba(22,26,34,.95)); border: 1px solid rgba(180,200,255,.25); color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .card b { display: block; font-size: 16px; margin-bottom: 4px; color: #ffd98a; }
  .card span { font-size: 13px; opacity: .85; }
  .heroes { display: grid; grid-template-columns: repeat(3, 96px); gap: 10px; }
  .hero { pointer-events: auto; background: rgba(30,36,46,.9); border: 2px solid rgba(255,255,255,.15); border-radius: 12px; padding: 6px; cursor: pointer; color: inherit; font: inherit; font-size: 12px; }
  .hero.sel { border-color: #ffd98a; }
  .hero img { width: 72px; height: 72px; image-rendering: pixelated; display: block; margin: 0 auto; }
  #banner { position: absolute; top: 22%; left: 0; right: 0; text-align: center; font-size: 26px; font-weight: 900; letter-spacing: 3px; color: #ffe2a0; text-shadow: 0 2px 0 #3a1a10, 0 0 18px rgba(255,160,60,.6); opacity: 0; transition: opacity .3s; }
</style>
</head>
<body>
<div id="hud">
  <div id="xpbar" class="bar"><i></i></div>
  <div id="stats"><span id="lv">Lv 1</span><span id="time">0:00</span><span id="kills">처치 0</span></div>
  <div id="hpbar" class="bar"><i></i></div>
  <div id="banner"></div>
  <div id="hint">WASD 이동 · Space 점프 · 마우스 드래그/Q·E 시점 · V 카메라</div>
  <div id="stick"><i></i></div>
  <button id="jumpBtn" class="btn">경공</button>
  <button id="camBtn" class="btn">카메라: 추적</button>
</div>
<div id="start" class="overlay on">
  <h1>강호난세 3D</h1>
  <p>시험판 · 언덕을 달리고, 경공으로 뛰어오르고, 절벽 위 보물을 노려라</p>
  <div class="heroes" id="heroes"></div>
  <button class="btn" id="go" style="font-size:18px;padding:12px 30px">출전</button>
</div>
<div id="levelup" class="overlay"><h1>깨달음</h1><div class="cards" id="cards"></div></div>
<div id="over" class="overlay"><h1>패배</h1><p id="overTxt"></p><button class="btn" onclick="location.reload()">다시</button></div>
<script src="three.min.js"></script>
<script>
(() => {
  'use strict';
  const IS_TOUCH = matchMedia('(pointer: coarse)').matches;
  const HEROES = [['cheongpung', '청풍'], ['yeoubi', '여우비'], ['dallae', '달래'], ['cheonma', '천마'], ['seola', '설아'], ['namgung', '남궁']];
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };

  // ---------- 지형 (게임 판정은 x,z 평면 + 높이 함수) ----------
  const WORLD = 170;
  const PLATEAUS = [
    { x: 42, z: -30, r: 13, h: 7, chest: true }, { x: -58, z: 36, r: 17, h: 9, chest: true },
    { x: 14, z: 72, r: 11, h: 6, chest: true }, { x: -34, z: -74, r: 15, h: 8, chest: true },
    { x: 90, z: 50, r: 20, h: 11, chest: true }, { x: -100, z: -20, r: 10, h: 3 },
    { x: 20, z: 22, r: 7, h: 2.6 }, { x: -18, z: -26, r: 8, h: 3 }, { x: 70, z: -88, r: 9, h: 3.2 },
  ];
  const BASINS = [{ x: -70, z: 100, r: 26, d: 7 }, { x: 110, z: -40, r: 18, d: 6 }];
  const WATER_Y = -2.4;
  function hills(x, z) {
    return 3.2 * Math.sin(x * 0.045) * Math.cos(z * 0.038) + 2.2 * Math.sin((x + z) * 0.021 + 1.3) + 1.1 * Math.sin(x * 0.11 + z * 0.07) + 0.5 * Math.cos(z * 0.16 - x * 0.05);
  }
  function H(x, z) {
    let h = hills(x, z);
    for (const p of PLATEAUS) { const d = Math.hypot(x - p.x, z - p.z); if (d < p.r + 2) h += p.h * smooth(p.r + 1.6, p.r, d); }
    for (const b of BASINS) { const d2 = ((x - b.x) ** 2 + (z - b.z) ** 2) / (b.r * b.r); if (d2 < 4) h -= b.d * Math.exp(-d2 * 1.6); }
    const edge = Math.max(Math.abs(x), Math.abs(z));
    if (edge > WORLD - 14) h += (edge - (WORLD - 14)) * 1.4;
    return h;
  }
  const onPlateau = (p, x, z) => Math.hypot(x - p.x, z - p.z) < p.r;

  // ---------- 렌더러 ----------
  const renderer = new THREE.WebGLRenderer({ antialias: !IS_TOUCH, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, IS_TOUCH ? 1.5 : 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.prepend(renderer.domElement);
  const scene = new THREE.Scene();
  const SKY = new THREE.Color('#9cc3d6');
  scene.background = SKY;
  scene.fog = new THREE.Fog(SKY, 45, 120);
  const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.3, 260);
  scene.add(new THREE.HemisphereLight('#e8f2ff', '#5a4a36', 1.15));
  const sun = new THREE.DirectionalLight('#fff1d6', 1.6);
  sun.position.set(60, 90, 30);
  scene.add(sun);
  addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

  // 하늘 돔 (그라데이션 + 먼 산)
  {
    const c = document.createElement('canvas'); c.width = 4; c.height = 256;
    const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, '#5b86b4'); gr.addColorStop(0.5, '#9cc3d6'); gr.addColorStop(1, '#e9dcc0');
    g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
    const dome = new THREE.Mesh(new THREE.SphereGeometry(240, 24, 12), new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide, fog: false, depthWrite: false }));
    scene.add(dome); scene.userData.dome = dome;
    const mg = new THREE.ConeGeometry(1, 1, 5);
    const mm = new THREE.MeshBasicMaterial({ color: '#7d9bb0', fog: false });
    for (let i = 0; i < 26; i++) {
      const a = (i / 26) * Math.PI * 2 + rand(-0.1, 0.1), s = rand(30, 60);
      const m = new THREE.Mesh(mg, mm); m.scale.set(s * 1.4, s, s * 1.4);
      m.position.set(Math.cos(a) * 225, s * 0.5 - 12, Math.sin(a) * 225); dome.add(m);
    }
  }

  // 지면 메쉬
  const ground = (() => {
    const SEG = 220, size = WORLD * 2;
    const geo = new THREE.PlaneGeometry(size, size, SEG, SEG); geo.rotateX(-Math.PI / 2);
    const pos = geo.attributes.position, col = new Float32Array(pos.count * 3);
    const grassA = new THREE.Color('#6f9a4a'), grassB = new THREE.Color('#8aa956'), dirt = new THREE.Color('#9b7d55'), rock = new THREE.Color('#857a6e'), sand = new THREE.Color('#cdb88a'), top = new THREE.Color('#a5b864'), c = new THREE.Color();
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), z = pos.getZ(i), y = H(x, z);
      pos.setY(i, y);
      const sl = Math.hypot(H(x + 0.6, z) - H(x - 0.6, z), H(x, z + 0.6) - H(x, z - 0.6)) / 1.2;
      const n = 0.5 + 0.5 * Math.sin(x * 0.23 + Math.cos(z * 0.19) * 2) * Math.cos(z * 0.21 - x * 0.07);
      c.copy(grassA).lerp(grassB, n);
      if (PLATEAUS.some((p) => onPlateau(p, x, z) && p.h > 4)) c.lerp(top, 0.5);
      if (Math.sin(x * 0.07 + z * 0.05) > 0.92) c.lerp(dirt, 0.6);
      if (y < WATER_Y + 0.7) c.lerp(sand, smooth(WATER_Y + 0.7, WATER_Y, y));
      if (sl > 0.9) c.copy(rock).lerp(dirt, n * 0.4).multiplyScalar(0.85 + 0.15 * Math.sin(y * 3));
      col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }));
    scene.add(m);
    const water = new THREE.Mesh(new THREE.PlaneGeometry(size, size), new THREE.MeshLambertMaterial({ color: '#4c8fb0', transparent: true, opacity: 0.72 }));
    water.rotation.x = -Math.PI / 2; water.position.y = WATER_Y; scene.add(water);
    return m;
  })();

  // 소품 (저폴리 소나무, 바위, 대나무) + 충돌 원
  const OBST = [];
  {
    const trunkG = new THREE.CylinderGeometry(0.25, 0.35, 2, 5), leafG = new THREE.ConeGeometry(1.6, 2.6, 6), rockG = new THREE.DodecahedronGeometry(1, 0), bambooG = new THREE.CylinderGeometry(0.12, 0.14, 6, 5);
    const trunkM = new THREE.MeshLambertMaterial({ color: '#6b4a32', flatShading: true }), leafM = new THREE.MeshLambertMaterial({ color: '#3f6e3c', flatShading: true }), leafM2 = new THREE.MeshLambertMaterial({ color: '#557f3d', flatShading: true }), rockM = new THREE.MeshLambertMaterial({ color: '#8d877c', flatShading: true }), bambooM = new THREE.MeshLambertMaterial({ color: '#7fa24e', flatShading: true });
    const free = (x, z) => H(x, z) > WATER_Y + 0.4 && Math.hypot(x, z) > 10 && !PLATEAUS.some((p) => Math.abs(Math.hypot(x - p.x, z - p.z) - p.r) < 3);
    for (let i = 0; i < 260; i++) {
      const x = rand(-WORLD + 16, WORLD - 16), z = rand(-WORLD + 16, WORLD - 16);
      if (!free(x, z)) continue;
      const y = H(x, z), kind = Math.random();
      const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = rand(0, 6.28);
      if (kind < 0.55) {
        const s = rand(1, 1.6);
        const t = new THREE.Mesh(trunkG, trunkM); t.position.y = 1; g.add(t);
        for (let k = 0; k < 3; k++) { const l = new THREE.Mesh(leafG, k % 2 ? leafM2 : leafM); l.position.y = 2.4 + k * 1.2; l.scale.setScalar(1 - k * 0.25); g.add(l); }
        g.scale.setScalar(s); OBST.push({ x, z, r: 0.6 * s });
      } else if (kind < 0.85) {
        const s = rand(0.8, 2.4), r = new THREE.Mesh(rockG, rockM); r.scale.set(s, s * rand(0.6, 0.9), s); r.position.y = s * 0.3; g.add(r);
        OBST.push({ x, z, r: s * 0.95 });
      } else {
        for (let k = 0; k < 7; k++) { const b = new THREE.Mesh(bambooG, bambooM); b.position.set(rand(-1.2, 1.2), 3, rand(-1.2, 1.2)); b.rotation.z = rand(-0.08, 0.08); g.add(b); }
        OBST.push({ x, z, r: 1.3 });
      }
      scene.add(g);
    }
  }

  // ---------- 텍스처 / 빌보드 ----------
  const loader = new THREE.TextureLoader();
  const texCache = {};
  function tex(key, flip) {
    const id = key + (flip ? '_f' : '');
    if (texCache[id]) return texCache[id];
    const t = loader.load(`../assets/${key}.png`);
    t.colorSpace = THREE.SRGBColorSpace; t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
    if (flip) { t.wrapS = THREE.RepeatWrapping; t.repeat.x = -1; t.offset.x = 1; }
    return (texCache[id] = t);
  }
  const shadowTex = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(0,0,0,.55)'); gr.addColorStop(0.6, 'rgba(0,0,0,.3)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
  })();
  const shadowGeo = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);
  const shadowMat = new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false });
  function makeActor(key, scale) {
    const mat = new THREE.SpriteMaterial({ map: tex(key), transparent: true, alphaTest: 0.4 });
    const sp = new THREE.Sprite(mat); sp.center.set(0.5, 0.1); sp.scale.set(scale, scale, 1);
    const sh = new THREE.Mesh(shadowGeo, shadowMat); sh.scale.setScalar(scale * 0.55); sh.renderOrder = 1;
    scene.add(sp); scene.add(sh);
    return { sp, sh, key, faceL: false };
  }
  function placeActor(a, x, y, z, gy, faceL) {
    a.sp.position.set(x, y, z);
    a.sh.position.set(x, gy + 0.06, z);
    const air = clamp((y - gy) / 8, 0, 0.7); a.sh.material.opacity = 1; a.sh.scale.setScalar(a.sp.scale.x * 0.55 * (1 - air));
    if (faceL !== a.faceL) { a.faceL = faceL; a.sp.material.map = tex(a.key, faceL); }
  }
  function dropActor(a) { scene.remove(a.sp); scene.remove(a.sh); a.sp.material.dispose(); }

  // ---------- 입력 ----------
  const keys = {};
  addEventListener('keydown', (e) => { keys[e.code] = true; if (e.code === 'Space') { wantJump = true; e.preventDefault(); } if (e.code === 'KeyV') toggleCam(); });
  addEventListener('keyup', (e) => { keys[e.code] = false; });
  let wantJump = false, camYaw = 0, camMode = 'chase';
  const stick = { id: null, ox: 0, oy: 0, x: 0, y: 0 }, look = { id: null, lx: 0 };
  const stickEl = document.getElementById('stick'), knob = stickEl.firstElementChild;
  const cv = renderer.domElement;
  cv.addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'mouse' && e.clientX < innerWidth * 0.5 && stick.id === null) {
      stick.id = e.pointerId; stick.ox = e.clientX; stick.oy = e.clientY; stick.x = stick.y = 0;
      stickEl.style.display = 'block'; stickEl.style.left = e.clientX + 'px'; stickEl.style.top = e.clientY + 'px'; knob.style.transform = '';
    } else if (look.id === null) { look.id = e.pointerId; look.lx = e.clientX; }
  });
  addEventListener('pointermove', (e) => {
    if (e.pointerId === stick.id) {
      let dx = e.clientX - stick.ox, dy = e.clientY - stick.oy; const d = Math.hypot(dx, dy), m = 46;
      if (d > m) { dx *= m / d; dy *= m / d; }
      stick.x = dx / m; stick.y = dy / m; knob.style.transform = `translate(${dx}px,${dy}px)`;
    } else if (e.pointerId === look.id) { camYaw -= (e.clientX - look.lx) * 0.006; look.lx = e.clientX; }
  });
  const endPtr = (e) => { if (e.pointerId === stick.id) { stick.id = null; stick.x = stick.y = 0; stickEl.style.display = 'none'; } if (e.pointerId === look.id) look.id = null; };
  addEventListener('pointerup', endPtr); addEventListener('pointercancel', endPtr);
  const jumpBtn = document.getElementById('jumpBtn');
  jumpBtn.addEventListener('pointerdown', (e) => { wantJump = true; e.stopPropagation(); });
  if (IS_TOUCH) { jumpBtn.style.display = 'block'; document.getElementById('hint').textContent = '왼쪽 드래그 이동 · 오른쪽 드래그 시점 · 경공 버튼 점프'; }
  const camBtn = document.getElementById('camBtn');
  function toggleCam() { camMode = camMode === 'chase' ? 'high' : 'chase'; camBtn.textContent = '카메라: ' + (camMode === 'chase' ? '추적' : '부감'); }
  camBtn.addEventListener('click', toggleCam);

  // ---------- 게임 상태 ----------
  let hero = HEROES[0][0];
  const P = { x: 0, z: 0, y: 0, vy: 0, lx: 0, lz: 0, hp: 100, maxHp: 100, speed: 9, jump: 13, jumps: 0, maxJumps: 2, air: false, inv: 0, lv: 1, xp: 0, next: 6, magnet: 4.5, faceL: false, bob: 0 };
  const W = { dmg: 12, cd: 0.8, t: 0, count: 1, pierce: 1, speed: 34, orbit: 0, orbitDmg: 7, orbitA: 0 };
  let actor, enemies = [], shots = [], orbs = [], pads = [], chests = [], blades = [];
  let time = 0, kills = 0, spawnT = 0, running = false, paused = false, bossOut = false;

  // 이동 판정: 가파른 절벽은 걸어서 못 오름, 공중이면 위로 착지 가능
  function canStep(x0, z0, x1, z1, footY) {
    if (Math.abs(x1) > WORLD - 6 || Math.abs(z1) > WORLD - 6) return false;
    const g1 = H(x1, z1);
    if (footY >= g1 - 0.25) return true;
    const d = Math.hypot(x1 - x0, z1 - z0) || 1e-3;
    return (g1 - H(x0, z0)) / d < 1.5 && g1 - footY < 0.9;
  }
  function moveXZ(o, dx, dz, footY, r) {
    for (const ob of OBST) {
      const ex = o.x + dx - ob.x, ez = o.z + dz - ob.z, d = Math.hypot(ex, ez), m = ob.r + r;
      if (d < m && d > 1e-4) { dx += (ex / d) * (m - d); dz += (ez / d) * (m - d); }
    }
    if (canStep(o.x, o.z, o.x + dx, o.z + dz, footY)) { o.x += dx; o.z += dz; return; }
    if (canStep(o.x, o.z, o.x + dx, o.z, footY)) { o.x += dx; return; }
    if (canStep(o.x, o.z, o.x, o.z + dz, footY)) o.z += dz;
  }

  // 경공대 (절벽 아래 도약대) & 보물상자
  const padGeo = new THREE.TorusGeometry(1.4, 0.18, 6, 20).rotateX(Math.PI / 2);
  const padMat = new THREE.MeshBasicMaterial({ color: '#7fe3ff', transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false });
  const padCore = new THREE.CircleGeometry(1.2, 18).rotateX(-Math.PI / 2);
  const padCoreMat = new THREE.MeshBasicMaterial({ color: '#3aa6d8', transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending, depthWrite: false });
  const chestBody = new THREE.BoxGeometry(1.6, 1.1, 1.1), chestLid = new THREE.BoxGeometry(1.7, 0.4, 1.2);
  const chestM = new THREE.MeshLambertMaterial({ color: '#8a2d24', flatShading: true }), goldM = new THREE.MeshLambertMaterial({ color: '#e8b34a', emissive: '#4a3000', flatShading: true });
  for (const p of PLATEAUS) {
    if (p.h < 5) continue;
    const a = Math.atan2(-p.z, -p.x);
    const x = p.x + Math.cos(a) * (p.r + 4.2), z = p.z + Math.sin(a) * (p.r + 4.2);
    const g = new THREE.Group(); g.position.set(x, H(x, z) + 0.08, z);

    banner('강호에 발을 들이다');
  };
  window.__dbg = { P, W, get enemies() { return enemies; }, start: () => document.getElementById('go').click(), setTime: (t) => (time = t), step: (n) => { for (let i = 0; i < n && running; i++) { if (paused) { document.querySelector('#cards .card')?.click(); } update(1 / 60); } return { t: time, kills, lv: P.lv, hp: P.hp, n: enemies.length }; } };

  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (running && !paused) update(dt);
    else if (!running && !actor) { camYaw += dt * 0.08; camera.position.set(Math.sin(camYaw) * 50, 26, Math.cos(camYaw) * 50); camera.lookAt(0, 0, 0); }
    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
})();
</script>
